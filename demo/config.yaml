# ============================================================
# bilibili-cli demo 配置
# 修改后运行：python main.py
# ============================================================

# UP 主：填名字（会自动搜索）或 UID 数字
# 例如：玄离199  或  67079745
up: IT咖啡馆

# 拉取最近 N 个视频的字幕
count: 8

# 发布时间过滤（可选，不配则从最新开始，两侧均含当天）
begin_date: 2026-10-12   # 起始日期 "2026-08-01"，只收该日期及之后发布的
end_date: 2026-11-04     # 结束日期 "2026-10-31"，只收该日期及之前发布的

# 运行前是否清空字幕/输出目录（true 会先清空，避免文件堆积）
clear_subtitles: false
clear_output: false

# 反爬：每个视频处理前随机休息秒数范围（null 表示不休息）
sleep_range: [0.2, 0.4]

# 本地 Ollama 模型名（可选：qwen3.5:4b / qwen3.5:2b / ...）
model: qwen3.5:4b

# 采样温度，null 表示用模型默认值
temperature: null

# 分析模式：all(全部) / single(单个) / bvids(指定多个)
analyze_mode: all

# 指定要分析的 BV 号列表（analyze_mode 为 single / bvids 时生效）
bvids: []

# 是否跳过某一步骤（true / false）
skip_fetch: false
skip_analyze: false

# 未登录时是否自动扫码登录（true / false）
auto_login: true
